name: Build AppStream catalogs

on:
  workflow_dispatch:
  schedule:
    - cron: '37 3 * * *'
  push:
    paths:
      - 'generate.py'
      - 'enrich.py'
      - 'catalog_sources.json'
      - 'tests/**'
      - 'repositories.json'
      - 'policy.json'
      - 'metadata/**'
      - 'update-version.py'
      - 'PKGBUILD'
      - '.github/workflows/appstream.yml'

permissions:
  contents: write

concurrency:
  group: appstream-catalogs
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    container: archlinux:base-devel
    steps:
      - name: Install generator
        run: >-
          pacman -Syu --noconfirm --needed python python-yaml python-pillow appstream-generator appstream archlinux-appstream-data
          libheif libjxl openslide poppler-glib imagemagick svt-av1 rav1e ffmpeg git github-cli
      - uses: actions/checkout@v4
      - name: Prepare build user
        run: |
          useradd -m builder
          chown -R builder:builder "$GITHUB_WORKSPACE"
      - name: Set catalog version
        run: runuser -u builder -- python update-version.py
      - name: Test enrichment and visibility rules
        run: runuser -u builder -- python -m unittest discover -s tests
      - uses: actions/cache@v4
        with:
          path: work
          key: appstream-${{ runner.os }}-${{ hashFiles('generate.py', 'repositories.json', 'policy.json') }}-${{ github.run_id }}
          restore-keys: |
            appstream-${{ runner.os }}-${{ hashFiles('generate.py', 'repositories.json', 'policy.json') }}-
            appstream-${{ runner.os }}-
      - name: Restore workspace ownership
        run: |
          mkdir -p "$GITHUB_WORKSPACE/work"
          chown -R builder:builder "$GITHUB_WORKSPACE/work"
      - name: Generate catalogs and source packages
        run: |
          runuser -u builder -- python generate.py all --explain \
            --version "$(sed -n 's/^pkgver=//p' PKGBUILD)"
      - name: Finalize source checksums
        run: runuser -u builder -- python update-version.py --finalize
      - name: Build pacman packages
        run: |
          cp dist/lunaos-appstream-data/*.tar.gz dist/chaotic-aur-appstream-data/*.tar.gz .
          runuser -u builder -- makepkg --cleanbuild --noconfirm --nodeps
      - name: Publish catalog sources
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          version=$(sed -n 's/^pkgver=//p' PKGBUILD)
          release=$(sed -n 's/^pkgrel=//p' PKGBUILD)
          gh release create "$version-$release" --target "$GITHUB_SHA" \
            --title "$version-$release" --notes 'Generated AppStream catalogs.' \
            dist/lunaos-appstream-data/*.tar.gz dist/chaotic-aur-appstream-data/*.tar.gz
      - name: Publish successful catalog version for lunaos-repo buildbot
        if: github.ref == 'refs/heads/main'
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add PKGBUILD .SRCINFO
          if ! git diff --cached --quiet; then
            git commit -m 'Update AppStream catalog package version'
            git push origin HEAD:main
          fi
      - name: Upload packages and generation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: appstream-catalogs
          if-no-files-found: warn
          path: |
            dist/
            *.pkg.tar.zst
            work/*/manifest.json
            work/*/generation.json
            work/*/export/hints/
            work/*/export/html/
            work/*/export/logs/
            work/enrichment/*/catalogs/audit.json
            work/enrichment/*/catalogs/sources.json
            work/enrichment/*/catalogs/quality.json
            work/enrichment/sources/status.json
